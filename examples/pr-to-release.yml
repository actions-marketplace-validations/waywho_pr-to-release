name: PR to Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr-to-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # - name: Set up Ruby
      #   uses: ruby/setup-ruby@v1
      #   with:
      #     bundler-cache: true
      - name: Update the changelog and release
        uses: waywho/pr-to-release@v1
