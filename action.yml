name: PR to Release - Changelog and Release in one workflow
description:
  Writes merged pull request descriptions into a Keep a Changelog CHANGELOG.md.
  A release label bumps the version, tags it and creates a GitHub Release.
author: WeiHsi Hu

branding:
  icon: tag
  color: blue

inputs:
  github-token:
    description: The token that reads pull requests and creates releases.
    default: ${{ github.token }}
  changelog-path:
    description: The path of the changelog file.
    default: CHANGELOG.md
  version-command:
    description:
      An optional shell command that the action runs when it creates a release.
      Leave it empty to run no command.
    default: ''
  tag-prefix:
    description: The text that starts every release tag.
    default: v
  major-label:
    description: The pull request label that releases a major version.
    default: major
  minor-label:
    description: The pull request label that releases a minor version.
    default: minor
  patch-label:
    description: The pull request label that releases a patch version.
    default: patch
  skip-label:
    description: The pull request label that skips the changelog entry.
    default: skip-release
  commit-user-name:
    description: The author name for the changelog commit.
    default: github-actions[bot]
  commit-user-email:
    description: The author email for the changelog commit.
    default: 41898282+github-actions[bot]@users.noreply.github.com

outputs:
  released:
    description: Is true when the action created a release.
  version:
    description: The version of the release.
  tag:
    description: The tag of the release.
  release-url:
    description: The URL of the GitHub Release.

runs:
  using: node24
  main: dist/index.js
